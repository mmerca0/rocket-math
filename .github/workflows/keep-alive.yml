name: Keep Supabase awake

# Free Supabase projects pause after a week without activity. This calls the
# app's health check once a day; that runs one tiny database query.
# Run it by hand from the Actions tab ("Run workflow") to test it.

on:
  schedule:
    - cron: "17 9 * * *" # every day at 09:17 UTC (off the hour: less queueing)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/health
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 30 \
            https://math.mikemercado.com/api/health
